dialog.about.text=The classic snake: eat the apples, grow, and never bite the wall or yourself.
dialog.about.rules=Steer the snake with the arrow keys. Every apple makes it longer and faster; golden apples give extra points, but only for a while. Running into the wall or your own body ends the game. P pauses, F11 switches to full screen and back. The title screen replays your best game.
