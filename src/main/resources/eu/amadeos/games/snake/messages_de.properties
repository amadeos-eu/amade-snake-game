dialog.about.text=Die klassische Schlange: Fressen Sie die Äpfel, wachsen Sie und beißen Sie nie in die Mauer oder sich selbst.
dialog.about.rules=Lenken Sie die Schlange mit den Pfeiltasten. Jeder Apfel macht sie länger und schneller; goldene Äpfel bringen Extrapunkte, aber nur eine Weile. Wer in die Mauer oder den eigenen Körper läuft, hat verloren. P hält an, F11 schaltet ins Vollbild und zurück. Das Titelbild zeigt Ihr bestes Spiel noch einmal.
